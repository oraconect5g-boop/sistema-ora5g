# Atualização das dependências (lote Q3, ORA-QUAL-014). O Dependabot abre PR; nada entra na main sem o CI
# limpo e a revisão, como qualquer mudança. Correções e versões menores vêm juntas numa PR por semana;
# versão maior vem sozinha (costuma pedir ajuste de código). Roteiro: docs/operacao/SEGURANCA_PERIODICA.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      correcoes-e-menores:
        update-types: ["patch", "minor"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
