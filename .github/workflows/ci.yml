name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacoes:
    name: Verificações
    runs-on: ubuntu-24.04
    # 16/11/2026: a suíte inteira (2.335 testes com as migrations e as provas no PostgreSQL 17, a build e o E2E) passou dos
    # 15 min no GitHub (run 43851653053, cancelada por tempo nos testes). O limite é do job inteiro; o orçamento de 8 s por
    # chamada da importação (concorrencia.test.ts) e todos os testes continuam iguais.
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Valores ficticios so para o CI; nenhum segredo real aqui.
      APP_ENV: development
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Procurar segredos nos arquivos
        run: npm run segredos
      - name: Procurar segredos nos commits do PR
        if: github.event_name == 'pull_request'
        run: npm run segredos -- --historico "origin/${{ github.base_ref }}..HEAD"
      # REV-003: no envio direto à main também confere cada commit novo, inclusive
      # segredo adicionado e removido no mesmo envio. Sem "antes" conhecido, confere tudo.
      - name: Procurar segredos nos commits enviados
        if: github.event_name == 'push'
        env:
          ANTES: ${{ github.event.before }}
        run: |
          if [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            npm run segredos -- --historico "$ANTES..HEAD"
          else
            npm run segredos -- --historico HEAD
          fi
      - name: Rastreabilidade dos requisitos em dia
        run: node scripts/gerar-rastreabilidade.mjs --conferir
      - name: Catálogo da API Nogle em dia com a cópia da documentação
        run: node scripts/gerar-catalogo-nogle.mjs --conferir
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Orçamento de desempenho (JavaScript e CSS de cada tela, QUAL-010a)
        run: node scripts/orcamento-de-desempenho.mjs --conferir
      - run: npm audit --omit=dev
      - run: npx -w @ora5g/plataforma playwright install --with-deps chromium
      - run: npm run test:e2e
