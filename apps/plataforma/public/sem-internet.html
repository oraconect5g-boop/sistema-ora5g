<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131a">
<title>Sem internet · Ora 5G</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fa; color: #10131a;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 26rem; margin: 1rem; padding: 1.5rem; background: #fff; border: 1px solid #e3e7ef; border-radius: 20px; }
  .marca { display: inline-grid; place-items: center; width: 3rem; height: 3rem; border-radius: 14px; background: #0a1322;
           color: #13d9c7; font-weight: 800; }
  h1 { margin: 1rem 0 .5rem; font-size: 1.4rem; }
  p { margin: .5rem 0; color: #3d4556; }
  button { margin-top: 1rem; width: 100%; min-height: 3rem; border: 0; border-radius: 12px; background: #2563eb; color: #fff;
           font: inherit; font-weight: 600; }
</style>
</head>
<body>
<main>
  <span class="marca" aria-hidden="true">5G</span>
  <h1>Sem internet agora</h1>
  <p>O Ora 5G precisa de internet para vender, consultar o estoque e aprovar.</p>
  <p>O que já foi gravado continua no sistema. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
